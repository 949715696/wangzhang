name: HGMS M0 Windows Gate

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Candidate ZIP filename under hgms-ci-carrier/'
        required: false
        default: 'hgms-m0-autofixed-v23.zip'

permissions:
  contents: read

concurrency:
  group: hgms-m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m0-windows:
    name: HGMS M0 / Windows 2025 / Node 22
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CI: '1'
      ELECTRON_ENABLE_LOGGING: '1'
    steps:
      - name: Checkout HGMS CI carrier branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Reconstruct verified HGMS candidate
        shell: pwsh
        run: |
          $candidateName = '${{ inputs.candidate }}'
          if ([string]::IsNullOrWhiteSpace($candidateName)) { $candidateName = 'hgms-m0-autofixed-v23.zip' }
          if ($candidateName -match '[\\/]') { throw "Candidate input must be a filename, not a path: $candidateName" }
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'hgms-ci-carrier\manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw 'No clean hgms-ci-carrier/manifest.json found. The old part-*.txt carrier is intentionally disabled because it was corrupted.' }
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.fileName -ne $candidateName) { throw "Workflow candidate '$candidateName' does not match manifest fileName '$($manifest.fileName)'." }
          $zip = Join-Path $env:GITHUB_WORKSPACE (Join-Path 'hgms-ci-carrier' $manifest.fileName)
          if (-not (Test-Path -LiteralPath $zip)) { throw "Candidate ZIP not found: $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Candidate SHA256: $hash"
          if ($hash -ne $manifest.sha256) { throw "Candidate SHA256 mismatch: expected $($manifest.sha256), got $hash" }
          $extract = Join-Path $env:RUNNER_TEMP 'hgms-m0'
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Force $zip $extract
          $root = Join-Path $extract $manifest.rootDirectory
          if (-not (Test-Path (Join-Path $root 'package.json'))) { throw 'HGMS candidate root/package.json not found.' }
          if (-not (Test-Path (Join-Path $root 'tools\run-m0-gate.ps1'))) { throw 'Authoritative tools/run-m0-gate.ps1 not found in candidate.' }
          "HGMS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run authoritative M0 Windows gate
        shell: pwsh
        working-directory: ${{ env.HGMS_ROOT }}
        run: powershell -ExecutionPolicy Bypass -File tools/run-m0-gate.ps1

      - name: Write GitHub CI metadata
        if: always()
        shell: pwsh
        run: |
          $resultRoot = if ($env:HGMS_ROOT) { $env:HGMS_ROOT } else { Join-Path $env:RUNNER_TEMP 'hgms-m0-gate-result' }
          $reports = Join-Path $resultRoot 'tests\reports'
          New-Item -ItemType Directory -Force -Path $reports | Out-Null
          "HGMS_REPORTS=$reports" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $jobStatus = '${{ job.status }}'
          $milestone = if ($jobStatus -eq 'success') { 'ACCEPTED' } else { 'REJECTED' }
          [ordered]@{
            schemaVersion = '1.2.0'
            milestone = 'M0'
            status = $milestone
            jobStatus = $jobStatus
            workflow = '${{ github.workflow }}'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            carrierSha = '${{ github.sha }}'
            ref = '${{ github.ref }}'
            runnerOs = '${{ runner.os }}'
            runnerArch = '${{ runner.arch }}'
            authoritativeGate = 'tools/run-m0-gate.ps1'
          } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $reports 'm0-github-windows-ci.json') -Encoding UTF8
          @(
            "M0 = $milestone",
            "workflow=${{ github.workflow }}",
            "run_id=${{ github.run_id }}",
            "run_attempt=${{ github.run_attempt }}",
            "carrier_sha=${{ github.sha }}",
            "ref=${{ github.ref }}",
            "runner_os=${{ runner.os }}",
            "runner_arch=${{ runner.arch }}",
            "job_status=$jobStatus",
            "authoritative_gate=tools/run-m0-gate.ps1"
          ) | Set-Content (Join-Path $reports 'm0-github-windows-ci.txt') -Encoding UTF8

      - name: Upload M0 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hgms-m0-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HGMS_REPORTS }}/**
          if-no-files-found: warn
          retention-days: 14
